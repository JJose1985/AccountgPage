<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="710" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE6CF"/>
      <stop offset="1" stop-color="#DDF5F8"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="130" x2="590" y2="370" gradientUnits="userSpaceOnUse">
