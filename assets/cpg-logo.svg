<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CPG logo</title>
  <desc id="desc">A transparent three-dimensional circular CPG mark with separate navy, teal, and coral initials.</desc>
  <defs>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0A2746" flood-opacity="0.38"/>
    </filter>
    <filter id="letter-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#061B32" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="64" cy="60" r="51" fill="#12365A" fill-opacity="0.4"/>
    <circle cx="64" cy="60" r="55" fill="none" stroke="#12365A" stroke-width="8"/>
    <circle cx="64" cy="60" r="49" fill="none" stroke="#FFF" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="64" y="74" fill="#F8FBFF" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-2" text-anchor="middle" stroke="#061B32" stroke-width="1.5" paint-order="stroke" filter="url(#letter-shadow)">CPG</text>
  </g>
</svg>